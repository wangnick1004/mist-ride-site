<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1020" width="1200" height="2040">
  <!-- 罐身正面印刷：弧長約 40 mm × 高 68 mm（130° 弧，r = 17.6 mm）｜機不可失 MIST-RIDE -->
  <rect width="600" height="1020" fill="#17242C"/>
  <rect x="18" y="18" width="564" height="984" rx="26" fill="none" stroke="#2A9D95" stroke-width="3"/>
  <!-- 商標：M 機車龍頭（握把、煞車拉桿）＋上方 5 顆霧點 -->
  <g transform="translate(156 150) scale(2.4)">
    <path d="M16 96L21 54C22 42 28 36 38 36H42C48 36 51 39 53 44L60 60L67 44C69 39 72 36 78 36H82C92 36 98 42 99 54L104 96" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.4 75L15.6 99M101.6 75L104.4 99" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
    <path d="M31.5 63L29 90M88.5 63L91 90" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
    <g fill="#5CC6BC"><circle cx="60" cy="24" r="4.6"/><circle cx="50" cy="16" r="3.4"/><circle cx="70" cy="16" r="3.4"/><circle cx="42" cy="8.5" r="2.3"/><circle cx="78" cy="8.5" r="2.3"/></g>
  </g>
  <text x="300" y="584" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="112" font-weight="900" fill="#FFFFFF" letter-spacing="8">機不可失</text>
  <text x="300" y="640" text-anchor="middle" font-family="Archivo, Helvetica Neue, sans-serif" style="font-stretch:125%" font-size="34" font-weight="800" fill="#5CC6BC" letter-spacing="12">MIST-RIDE</text>
  <text x="300" y="730" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="4">晨霧 控油化妝水</text>
  <rect x="240" y="760" width="120" height="6" rx="3" fill="#F3A536"/>
  <text x="300" y="816" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="30" fill="#B9C6CB">控油・保濕・戴帽前 3 下</text>
  <text x="300" y="910" text-anchor="middle" font-family="Archivo, Helvetica Neue, sans-serif" font-size="40" font-weight="700" fill="#F3A536">50 mL</text>
  <text x="300" y="958" text-anchor="middle" font-family="Archivo, Noto Sans TC, sans-serif" font-size="22" fill="#98A9AF" letter-spacing="3">BAG-ON-VALVE ・ 壓縮空氣</text>
